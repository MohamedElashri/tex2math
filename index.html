<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert LaTeX expressions to MathML with a local browser-based converter."
    />
    <meta name="keywords" content="LaTeX, MathML, converter, tool" />
    <title>LaTeX to MathML Converter</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/Temml-Local.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <script src="js/temml.min.js"></script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="./index.html" aria-label="LaTeX to MathML Converter home">
        <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
        <span class="brand-text">
          <span class="brand-title">LaTeX to MathML</span>
          <span class="brand-subtitle">Converter</span>
        </span>
      </a>

      <div class="header-actions">
        <span id="statusText" class="status-pill" role="status" aria-live="polite">Ready</span>
        <button
          id="themeToggle"
          class="icon-button theme-toggle"
          type="button"
          title="Toggle theme"
          aria-label="Toggle theme"
          aria-pressed="false"
        >
          <i class="fas fa-sun" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="workspace" aria-label="LaTeX to MathML converter">
      <section class="panel input-panel" aria-labelledby="latexTitle">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Source</p>
            <h1 id="latexTitle">LaTeX</h1>
          </div>
          <button
            id="clearInputBtn"
            class="icon-button subtle-button"
            type="button"
            title="Clear input"
            aria-label="Clear input"
          >
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <div class="editor-wrapper">
          <pre id="latexHighlight" class="syntax-highlight" aria-hidden="true"><code id="latexHighlightCode"></code></pre>
          <textarea
            id="latexInput"
            aria-label="LaTeX input"
            placeholder="Enter LaTeX"
            spellcheck="false"
          >\def\d{\mathrm{d}}

\oint_C \vec{B}\circ \d\vec{l} = \mu_0 \left( I_{\text{enc}} + \varepsilon_0 \frac{\d}{\d t} \int_S \vec{E} \circ \hat{n}\; \d a \right)</textarea>
        </div>
      </section>

      <section class="panel output-panel" aria-labelledby="outputTitle">
        <div class="panel-header output-header">
          <div>
            <p class="eyebrow">Result</p>
            <h1 id="outputTitle">Output</h1>
          </div>

          <div class="output-controls">
            <div class="mode-segment" role="tablist" aria-label="Output mode">
              <button
                class="mode-button active"
                type="button"
                data-mode="math"
                role="tab"
                aria-selected="true"
                title="Rendered math"
              >
                <i class="fas fa-square-root-alt" aria-hidden="true"></i>
                <span>Math</span>
              </button>
              <button
                class="mode-button"
                type="button"
                data-mode="mathml"
                role="tab"
                aria-selected="false"
                title="Formatted MathML"
              >
                <i class="fas fa-code" aria-hidden="true"></i>
                <span>MathML</span>
              </button>
              <button
                class="mode-button"
                type="button"
                data-mode="flat"
                role="tab"
                aria-selected="false"
                title="Flat MathML"
              >
                <i class="fas fa-align-left" aria-hidden="true"></i>
                <span>Flat</span>
              </button>
            </div>

            <button
              id="copyBtn"
              class="icon-button copy-button"
              type="button"
              title="Copy output"
              aria-label="Copy output"
            >
              <i class="far fa-copy" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <div id="mathPreview" class="math-preview" aria-label="Rendered math output"></div>
        <div id="outputEditorWrapper" class="editor-wrapper" hidden>
          <pre id="mathmlHighlight" class="syntax-highlight" aria-hidden="true"><code id="mathmlHighlightCode"></code></pre>
          <textarea
            id="mathmlOutput"
            aria-label="MathML output"
            readonly
            spellcheck="false"
          ></textarea>
        </div>
      </section>
    </main>

    <footer class="app-footer">&copy; 2026 Mohamed Elashri</footer>
    <script src="js/app.js"></script>
  </body>
</html>
